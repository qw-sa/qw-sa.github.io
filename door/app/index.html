<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="عنواني">
<meta name="theme-color" content="#0f766e">
<title>عنواني للمندوب</title>
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --ink:#1c1917; --muted:#78716c;
    --brand:#0f766e; --brand-d:#115e59; --wa:#1fa855; --line:#e7e2d8; --warn:#b45309;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif}
  body{padding:0 0 calc(env(safe-area-inset-bottom) + 90px);min-height:100vh;
    background:
      radial-gradient(circle at 1px 1px, rgba(15,118,110,.10) 1px, transparent 0) 0 0/22px 22px,
      linear-gradient(180deg,#eaf5f2 0%, var(--bg) 340px)}
  header{position:relative;overflow:hidden;color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 20px 34px;
    background:linear-gradient(135deg,#14b8a6,#0b5e57);border-radius:0 0 28px 28px}
  header::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08);top:-120px;left:-80px}
  header .brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
  header img{width:52px;height:52px;border-radius:14px;box-shadow:0 6px 16px -6px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.35)}
  header h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.3px}
  header p{margin:2px 0 0;opacity:.85;font-size:14.5px}
  header a{position:absolute;z-index:1;left:16px;top:calc(env(safe-area-inset-top) + 18px);color:#fff;opacity:.85;font-size:13px;text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:4px 10px}
  main{margin-top:-18px!important;position:relative}
  main{padding:8px 16px;max-width:560px;margin:0 auto}
  .empty{background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:34px 20px;text-align:center;color:var(--muted);margin-top:14px}
  .empty .big{font-size:46px;margin-bottom:6px}
  .card{background:var(--card);border-radius:20px;overflow:hidden;margin:14px 0;box-shadow:0 1px 0 var(--line),0 6px 20px -12px rgba(0,0,0,.25)}
  .card img{width:100%;height:210px;object-fit:cover;display:block;background:#ddd}
  .noimg{height:90px;display:flex;align-items:center;justify-content:center;background:#ece7dc;color:var(--muted)}
  .body{padding:14px 16px 16px}
  .title{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .title h2{margin:0;font-size:21px;font-weight:800}
  .door{background:var(--brand);color:#fff;border-radius:12px;padding:4px 12px;font-weight:800;font-size:17px;white-space:nowrap}
  .meta{color:var(--muted);font-size:15px;margin:8px 0 0;line-height:1.7}
  .meta b{color:var(--ink);font-weight:700}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .actions .full{grid-column:1/-1}
  button,.btn{font:inherit;border:0;border-radius:14px;padding:13px 10px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
  .b-wa{background:var(--wa);color:#fff;font-size:18px}
  .b-soft{background:#efece4;color:var(--ink)}
  .b-del{background:transparent;color:#b91c1c;font-size:14px;padding:8px}
  .fab{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);max-width:528px;margin:0 auto;background:var(--brand);color:#fff;font-size:19px;padding:17px;border-radius:18px;box-shadow:0 10px 24px -8px rgba(15,118,110,.6)}
  /* sheet */
  .sheet{position:fixed;inset:0;background:rgba(28,25,23,.45);display:none;align-items:flex-end;z-index:10}
  .sheet.on{display:flex}
  .panel{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow:auto}
  .panel h3{margin:0 0 12px;font-size:21px;font-weight:800}
  label{display:block;font-weight:700;margin:14px 0 6px;font-size:15px}
  input,textarea{width:100%;font:inherit;font-size:17px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus{outline:none;border-color:var(--brand)}
  textarea{min-height:64px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pick{border:2px dashed #cfc8b9;background:#fff;border-radius:16px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;display:block}
  .pick img{max-width:100%;max-height:190px;border-radius:12px;display:block;margin:0 auto}
  .loc{display:flex;gap:8px;align-items:center}
  .loc button{flex:none}
  .ok{color:var(--brand);font-weight:700;font-size:14px;margin-top:6px}
  .err{color:var(--warn);font-weight:500;font-size:14px;margin-top:6px}
  .hint{color:var(--muted);font-size:13px;margin-top:4px}
  .save{width:100%;margin-top:18px;background:var(--brand);color:#fff;font-size:18px;padding:16px}
  .cancel{width:100%;margin-top:8px;background:transparent;color:var(--muted)}
  .join{display:none;background:linear-gradient(135deg,#ecfdf9,#fff);border:1.5px solid #a7e3d8;border-radius:20px;padding:16px;margin:18px 0 0}
  .join.on{display:block}
  .join .jt{font-size:19px;font-weight:800;color:var(--brand-d)}
  .join .jp{margin:4px 0 10px;color:var(--muted);font-size:15px;line-height:1.6}
  .join input:not([type=checkbox]){margin-top:8px}
  .join .ck{display:flex;gap:8px;align-items:flex-start;font-weight:500;font-size:13.5px;color:var(--muted);line-height:1.6;margin:12px 0 0}
  .join .ck input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--brand)}
  .join .ck a{color:var(--brand)}
  .jbtn{width:100%;margin-top:12px;background:var(--brand);color:#fff}
  .foot{text-align:center;font-size:13px;margin:22px 0 0}
  .foot a{color:var(--muted)}
  .install{display:none;background:#fff8e6;border:1.5px solid #f5d38a;border-radius:18px;padding:14px 16px;margin:14px 0 0;line-height:1.75;font-size:15px}
  .install.on{display:block}
  .install b.h{display:block;font-size:17px;color:#92400e;margin-bottom:2px}
  .install .row2{display:flex;gap:8px;margin-top:10px}
  .install button{padding:10px 14px;font-size:15px}
  .install .go{background:var(--brand);color:#fff}
  .install .later{background:transparent;color:var(--muted)}
  .toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%) translateY(-120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;transition:transform .25s;z-index:20;max-width:90%;text-align:center}
  .toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <a href="../">عن التطبيق</a>
  <div class="brand">
    <img src="../logo.svg" alt="">
    <div>
      <h1>عنواني للمندوب</h1>
      <p>احفظ الموقع وصورة الباب، وأرسلها بضغطة</p>
    </div>
  </div>
</header>
<main>
  <div class="install" id="install">
    <b class="h">📌 خطوة مهمة عشان تنحفظ عناوينك</b>
    <span id="installTxt"></span>
    <div class="row2">
      <button class="go" id="installGo" style="display:none">إضافة الآن</button>
      <button class="later" id="installLater">لاحقاً</button>
    </div>
  </div>
  <div id="list"></div>
  <form class="join" id="join" autocomplete="on">
    <div class="jt">🎁 النسخة المميزة قادمة</div>
    <p class="jp">سجّل رقمك الحين، وتحصل على <b>٣ أشهر مجاناً</b> أول ما تنطلق.</p>
    <div id="joinFields">
      <input id="j-name" placeholder="الاسم" autocomplete="name">
      <input id="j-phone" type="tel" inputmode="tel" placeholder="رقم الجوال 05xxxxxxxx" dir="ltr" style="text-align:right" autocomplete="tel" required>
      <input id="j-city" placeholder="المدينة" autocomplete="address-level2">
      <label class="ck"><input type="checkbox" id="j-ok" required> أوافق على حفظ بياناتي للتواصل معي بخصوص التطبيق، حسب <a href="../privacy.html">سياسة الخصوصية</a>.</label>
      <div id="joinErr" class="err"></div>
      <button type="submit" class="jbtn">سجّلني</button>
    </div>
  </form>
  <p class="foot"><a href="../privacy.html">سياسة الخصوصية</a></p>
</main>
<button class="fab" id="addBtn">＋ إضافة عنوان</button>

<div class="sheet" id="sheet">
  <form class="panel" id="form" autocomplete="off">
    <h3 id="formTitle">عنوان جديد</h3>

    <label>اسم المكان</label>
    <input id="f-name" placeholder="مثال: البيت، الاستراحة، المكتب" required>

    <div class="row">
      <div>
        <label>رقم الباب</label>
        <input id="f-door" inputmode="numeric" placeholder="مثال: 12">
      </div>
      <div>
        <label>رقم الجوال</label>
        <input id="f-phone" type="tel" inputmode="tel" placeholder="05xxxxxxxx" dir="ltr" style="text-align:right">
      </div>
    </div>

    <label>الموقع</label>
    <div class="loc">
      <button type="button" class="b-soft" id="gpsBtn">📍 موقعي الحالي</button>
      <input id="f-map" placeholder="أو الصق رابط قوقل ماب" dir="ltr" style="text-align:right">
    </div>
    <div id="locMsg" class="hint">اضغط "موقعي الحالي" وأنت عند البيت</div>

    <label>صورة الباب</label>
    <div class="pick" id="pick"><span id="pickTxt">📷 صوّر الباب أو اختر صورة</span></div>
    <div class="row" style="margin-top:8px">
      <label class="btn b-soft" style="margin:0">
        <input type="file" accept="image/*" capture="environment" id="f-photo" hidden>📷 تصوير
      </label>
      <label class="btn b-soft" style="margin:0">
        <input type="file" accept="image/*" id="f-gallery" hidden>🖼️ من الاستديو
      </label>
    </div>

    <label>ملاحظة للمندوب (اختياري)</label>
    <textarea id="f-note" placeholder="مثال: الباب البني جنب المسجد، اتصل قبل توصل"></textarea>

    <button type="submit" class="save">حفظ</button>
    <button type="button" class="cancel" id="cancelBtn">إلغاء</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="qr.js"></script>
<script>
(function(){
  var KEY = 'door-addresses-v1';
  var items = [];
  var editing = null, draftPhoto = null, draftLat = null, draftLng = null;
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- storage (IndexedDB for photos, fallback memory) ---------- */
  var db = null;
  function openDB(){
    return new Promise(function(res){
      try{
        var r = indexedDB.open('door-app', 1);
        r.onupgradeneeded = function(){ r.result.createObjectStore('s'); };
        r.onsuccess = function(){ db = r.result; res(); };
        r.onerror = function(){ res(); };
      }catch(e){ res(); }
    });
  }
  function load(){
    return new Promise(function(res){
      if(db){
        try{
          var q = db.transaction('s').objectStore('s').get(KEY);
          q.onsuccess = function(){ items = q.result || []; res(); };
          q.onerror = function(){ res(); };
          return;
        }catch(e){}
      }
      try{ items = JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){}
      res();
    });
  }
  function persist(){
    if(db){
      try{ db.transaction('s','readwrite').objectStore('s').put(items, KEY); return; }catch(e){}
    }
    try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){}
  }

  /* ---------- helpers ---------- */
  function toast(t){ var el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove('on');},2200); }
  function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function mapUrl(it){
    if(it.lat!=null && it.lng!=null) return 'https://maps.google.com/?q='+it.lat+','+it.lng;
    return it.map || '';
  }
  function message(it){
    var m = ['📍 '+it.name];
    if(it.door) m.push('🚪 رقم الباب: '+it.door);
    if(it.phone) m.push('📞 الجوال: '+it.phone);
    var u = mapUrl(it); if(u) m.push('🗺️ الموقع: '+u);
    if(it.note) m.push('📝 '+it.note);
    m.push('');
    m.push('— أُرسلت عبر «عنواني للمندوب» جرّبها مجاناً: https://qw-sa.github.io/door/');
    return m.join('\n');
  }
  function dataURLtoFile(d, name){
    var p=d.split(','), mime=p[0].match(/:(.*?);/)[1], b=atob(p[1]), n=b.length, u=new Uint8Array(n);
    while(n--) u[n]=b.charCodeAt(n);
    return new File([u], name, {type:mime});
  }
  function shrink(file){
    return new Promise(function(res,rej){
      var fr=new FileReader();
      fr.onload=function(){
        var img=new Image();
        img.onload=function(){
          var max=1280, w=img.width, h=img.height, s=Math.min(1, max/Math.max(w,h));
          var c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          res(c.toDataURL('image/jpeg',0.82));
        };
        img.onerror=rej; img.src=fr.result;
      };
      fr.onerror=rej; fr.readAsDataURL(file);
    });
  }

  /* ---------- render ---------- */
  function render(){
    setTimeout(prebuild, 50);
    var joined=false; try{ joined=!!localStorage.getItem('door-joined'); }catch(e){}
    $('join').classList.toggle('on', items.length>0 && !joined);
    var L=$('list');
    if(!items.length){
      L.innerHTML='<div class="empty"><div class="big">🏠</div><b>ما فيه عناوين محفوظة</b><br>اضغط "إضافة عنوان" تحت</div>';
      return;
    }
    L.innerHTML = items.map(function(it,i){
      var u=mapUrl(it);
      return '<div class="card">'+
        (it.photo?'<img src="'+it.photo+'" alt="صورة الباب">':'<div class="noimg">بدون صورة</div>')+
        '<div class="body">'+
          '<div class="title"><h2>'+esc(it.name)+'</h2>'+(it.door?'<span class="door">🚪 '+esc(it.door)+'</span>':'')+'</div>'+
          '<p class="meta">'+(it.phone?'📞 <b dir="ltr">'+esc(it.phone)+'</b><br>':'')+(u?'🗺️ الموقع محفوظ':'<span style="color:var(--warn)">⚠️ بدون موقع</span>')+(it.note?'<br>📝 '+esc(it.note):'')+'</p>'+
          '<div class="actions">'+
            '<button class="b-wa full" data-a="share" data-i="'+i+'">إرسال للمندوب (واتساب)</button>'+
            '<button class="b-soft" data-a="copy" data-i="'+i+'">📋 نسخ</button>'+
            (u?'<a class="btn b-soft" href="'+esc(u)+'" target="_blank" rel="noopener">🗺️ الخريطة</a>':'<button class="b-soft" data-a="edit" data-i="'+i+'">✏️ تعديل</button>')+
            (u?'<button class="b-soft" data-a="edit" data-i="'+i+'">✏️ تعديل</button>':'')+
            '<button class="b-del'+(u?'':' full')+'" data-a="del" data-i="'+i+'">حذف</button>'+
          '</div>'+
        '</div></div>';
    }).join('');
  }

  /* ---------- actions ---------- */
  $('list').addEventListener('click', function(e){
    var b=e.target.closest('[data-a]'); if(!b) return;
    var i=+b.dataset.i, it=items[i], a=b.dataset.a;
    if(a==='share'){ share(it); track('إرسال للمندوب'); }
    else if(a==='copy'){ copy(message(it)); track('نسخ'); }
    else if(a==='edit') openForm(i);
    else if(a==='del'){
      if(b.dataset.sure){ items.splice(i,1); persist(); render(); toast('تم الحذف'); }
      else { b.dataset.sure='1'; b.textContent='اضغط مرة ثانية للتأكيد'; setTimeout(function(){ if(b.isConnected){ delete b.dataset.sure; b.textContent='حذف'; } },3000); }
    }
  });

  function copy(t){
    var done=function(){ toast('تم النسخ ✅ الصقه في الواتساب'); };
    try{
      navigator.clipboard.writeText(t).then(done, fallback);
    }catch(e){ fallback(); }
    function fallback(){
      var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){ toast('ما قدرت أنسخ'); }
      ta.remove();
    }
  }

  /* ---------- info card: one image that carries everything ---------- */
  var cards = new WeakMap(), ready = new WeakMap();   // item -> Promise<File> / File
  function loadImg(src){ return new Promise(function(res,rej){ var i=new Image(); i.onload=function(){res(i);}; i.onerror=rej; i.src=src; }); }
  function wrap(ctx, text, maxW){
    var words=String(text).split(/\s+/), lines=[], cur='';
    words.forEach(function(w){
      var t=cur?cur+' '+w:w;
      if(ctx.measureText(t).width>maxW && cur){ lines.push(cur); cur=w; } else cur=t;
    });
    if(cur) lines.push(cur);
    return lines;
  }
  function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function buildCard(it){
    var W=1080, P=60, F='Tajawal, "Geeza Pro", system-ui, sans-serif';
    var url=mapUrl(it);
    var fontsReady = (document.fonts && document.fonts.load) ?
      Promise.all([document.fonts.load('800 64px Tajawal'),document.fonts.load('700 44px Tajawal'),document.fonts.load('500 38px Tajawal')]).catch(function(){}) : Promise.resolve();
    return Promise.all([fontsReady, it.photo?loadImg(it.photo):null]).then(function(r){
      var img=r[1];
      var photoH = img ? Math.round(W*0.75) : 0;
      var qrS = url ? 300 : 0;
      var textW = W-2*P-(qrS?qrS+40:0);

      // measure text block
      var m=document.createElement('canvas').getContext('2d');
      m.direction='rtl';
      var rows=[];
      if(it.door) rows.push({t:'🚪 رقم الباب: '+it.door, f:'800 50px '+F, h:72, c:'#0b5e57'});
      if(it.phone) rows.push({t:'📞 الجوال: '+it.phone, f:'700 44px '+F, h:64, c:'#1c1917'});
      if(it.note){ m.font='500 38px '+F; wrap(m,'📝 '+it.note,textW).forEach(function(l){ rows.push({t:l,f:'500 38px '+F,h:54,c:'#57534e'}); }); }
      if(!url) rows.push({t:'⚠️ بدون موقع', f:'500 38px '+F, h:54, c:'#b45309'});
      var textH = 92 + rows.reduce(function(s,r){return s+r.h;},0);
      var bodyH = Math.max(textH, qrS? qrS+64 : 0) + P*2;
      var footH = 96;
      var H = photoH + bodyH + footH;

      var c=document.createElement('canvas'); c.width=W; c.height=H;
      var x=c.getContext('2d'); x.direction='rtl'; x.textBaseline='top';
      x.fillStyle='#ffffff'; x.fillRect(0,0,W,H);

      if(img){
        var s=Math.max(W/img.width, photoH/img.height), iw=img.width*s, ih=img.height*s;
        x.save(); x.beginPath(); x.rect(0,0,W,photoH); x.clip(); x.drawImage(img,(W-iw)/2,(photoH-ih)/2,iw,ih); x.restore();
        if(it.door){ // door number badge on the photo
          x.font='800 64px '+F; var bw=Math.max(150, x.measureText(it.door).width+80);
          x.fillStyle='rgba(15,118,110,.95)'; rr(x,W-P-bw,P,bw,110,26); x.fill();
          x.fillStyle='#fff'; x.textAlign='center'; x.fillText(it.door, W-P-bw/2, P+22);
        }
      }

      var y=photoH+P;
      x.textAlign='right';
      x.font='800 64px '+F; x.fillStyle='#1c1917'; x.fillText('📍 '+it.name, W-P, y); y+=92;
      rows.forEach(function(r){ x.font=r.f; x.fillStyle=r.c; x.fillText(r.t, W-P, y); y+=r.h; });

      if(url && window.qrcode){
        try{
          var q=qrcode(0,'M'); q.addData(url); q.make();
          var n=q.getModuleCount(), cell=Math.floor((qrS-24)/n), qs=cell*n, qx=P, qy=photoH+P;
          x.fillStyle='#f4f1ea'; rr(x,qx,qy,qrS,qrS,22); x.fill();
          var ox=qx+(qrS-qs)/2, oy=qy+(qrS-qs)/2;
          x.fillStyle='#ffffff'; x.fillRect(ox-6,oy-6,qs+12,qs+12);
          x.fillStyle='#111';
          for(var i=0;i<n;i++) for(var j=0;j<n;j++) if(q.isDark(i,j)) x.fillRect(ox+j*cell, oy+i*cell, cell, cell);
          x.font='700 30px '+F; x.fillStyle='#0b5e57'; x.textAlign='center';
          x.fillText('امسح الكود للموقع 🗺️', qx+qrS/2, qy+qrS+16);
        }catch(e){}
      }

      var fy=H-footH, g=x.createLinearGradient(0,fy,W,H); g.addColorStop(0,'#14b8a6'); g.addColorStop(1,'#0b5e57');
      x.fillStyle=g; x.fillRect(0,fy,W,footH);
      x.fillStyle='#fff'; x.textAlign='center'; x.font='700 36px '+F;
      x.fillText('عنواني للمندوب  •  qw-sa.github.io/door', W/2, fy+28);

      return new Promise(function(res){
        c.toBlob(function(b){ res(new File([b], 'عنوان-'+(it.door||it.name)+'.jpg', {type:'image/jpeg'})); }, 'image/jpeg', 0.88);
      });
    });
  }
  function cardFor(it){
    if(!cards.has(it)){ var p=buildCard(it); p.catch(function(){ cards.delete(it); }); cards.set(it,p); }
    return cards.get(it);
  }
  function prebuild(){ items.forEach(function(it){ cardFor(it).then(function(f){ ready.set(it,f); }, function(){}); }); }

  function share(it){
    var text=message(it);
    if(!navigator.share){ wa(text); return; }
    var f=ready.get(it);
    if(!f){ toast('ثانية… جاري تجهيز الصورة، اضغط مرة ثانية'); cardFor(it).then(function(x){ ready.set(it,x); }); return; }
    var data={files:[f], text:text};
    if(navigator.canShare && !navigator.canShare({files:[f]})) data={text:text};
    navigator.share(data).catch(function(err){
      if(err && err.name==='AbortError') return;
      navigator.share({text:text}).catch(function(){ wa(text); });
    });
  }
  function wa(text){ location.href='https://wa.me/?text='+encodeURIComponent(text); }

  /* ---------- form ---------- */
  function openForm(i){
    editing = (i==null)?null:i;
    var it = editing==null ? {} : items[editing];
    $('formTitle').textContent = editing==null ? 'عنوان جديد' : 'تعديل العنوان';
    $('f-name').value=it.name||''; $('f-door').value=it.door||''; $('f-phone').value=it.phone||'';
    $('f-map').value=it.map||''; $('f-note').value=it.note||'';
    draftPhoto=it.photo||null; draftLat=it.lat!=null?it.lat:null; draftLng=it.lng!=null?it.lng:null;
    $('pickTxt').innerHTML = draftPhoto ? '<img src="'+draftPhoto+'">' : '📷 صوّر الباب أو اختر صورة';
    setLocMsg();
    $('sheet').classList.add('on');
  }
  function closeForm(){ $('sheet').classList.remove('on'); }
  function setLocMsg(t,cls){
    var m=$('locMsg');
    if(t){ m.textContent=t; m.className=cls||'hint'; return; }
    if(draftLat!=null){ m.textContent='✅ تم تحديد الموقع'; m.className='ok'; }
    else { m.textContent='اضغط "موقعي الحالي" وأنت عند البيت'; m.className='hint'; }
  }

  $('addBtn').onclick=function(){ openForm(null); };
  $('cancelBtn').onclick=closeForm;
  $('sheet').addEventListener('click',function(e){ if(e.target===this) closeForm(); });

  $('gpsBtn').onclick=function(){
    if(!navigator.geolocation){ setLocMsg('الجوال ما يدعم تحديد الموقع، الصق رابط الخريطة','err'); return; }
    setLocMsg('جاري تحديد موقعك...','hint');
    navigator.geolocation.getCurrentPosition(function(p){
      draftLat=+p.coords.latitude.toFixed(6); draftLng=+p.coords.longitude.toFixed(6);
      $('f-map').value=''; setLocMsg();
    },function(){
      setLocMsg('ما قدرت أحدد الموقع. اسمح بالموقع من الإعدادات، أو الصق رابط قوقل ماب','err');
    },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  };
  $('f-map').addEventListener('input',function(){
    if(this.value.trim()){ draftLat=null; draftLng=null; setLocMsg('✅ سيُرسل رابط الخريطة اللي لصقته','ok'); }
    else setLocMsg();
  });

  function onPhoto(){
    var f=this.files && this.files[0]; if(!f) return;
    $('pickTxt').textContent='جاري تجهيز الصورة...';
    shrink(f).then(function(d){ draftPhoto=d; $('pickTxt').innerHTML='<img src="'+d+'">'; })
      .catch(function(){ $('pickTxt').textContent='تعذّر قراءة الصورة، جرّب مرة ثانية'; });
    this.value='';
  }
  $('f-photo').addEventListener('change',onPhoto);
  $('f-gallery').addEventListener('change',onPhoto);

  $('form').addEventListener('submit',function(e){
    e.preventDefault();
    var it={
      name:$('f-name').value.trim()||'البيت',
      door:$('f-door').value.trim(),
      phone:$('f-phone').value.trim(),
      map:$('f-map').value.trim(),
      note:$('f-note').value.trim(),
      photo:draftPhoto, lat:draftLat, lng:draftLng
    };
    if(editing==null){ items.unshift(it); track('حفظ عنوان'); } else items[editing]=it;
    persist(); render(); closeForm(); toast('تم الحفظ ✅');
  });

  /* ---------- anonymous usage counts + interest sign-up (Google Form → Sheet) ---------- */
  var FORM='https://docs.google.com/forms/d/e/1FAIpQLSflfa8YZwiD1tz6lenpdqH4rkt1QT8Dxzmh4DfZ-gQI1jc9pA/formResponse';
  var E={type:'814838570', name:'1020080269', phone:'967858551', city:'1255482374'};
  function sendForm(f){
    try{
      var b=new URLSearchParams();
      Object.keys(f).forEach(function(k){ b.append('entry.'+E[k], f[k]); });
      return fetch(FORM,{method:'POST',mode:'no-cors',body:b});
    }catch(e){ return Promise.reject(e); }
  }
  function track(t){ sendForm({type:t}).catch(function(){}); }
  function trackOnce(key,t){ try{ if(localStorage.getItem(key)) return; localStorage.setItem(key,'1'); }catch(e){ return; } track(t); }
  function trackDaily(){
    try{ var d=new Date().toISOString().slice(0,10); if(localStorage.getItem('door-t-day')===d) return; localStorage.setItem('door-t-day',d); }catch(e){ return; }
    track('استخدام يومي');
  }

  $('join').addEventListener('submit',function(e){
    e.preventDefault();
    var ph=$('j-phone').value.replace(/[\s\-]/g,'').replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c);});
    if(!/^(05\d{8}|\+?9665\d{8})$/.test(ph)){ $('joinErr').textContent='اكتب رقم جوال صحيح، مثل 0551234567'; return; }
    if(!$('j-ok').checked){ $('joinErr').textContent='لازم توافق على حفظ البيانات'; return; }
    $('joinErr').textContent='';
    var btn=this.querySelector('.jbtn'); btn.disabled=true; btn.textContent='جاري التسجيل...';
    sendForm({type:'تسجيل اهتمام', name:$('j-name').value.trim(), phone:ph, city:$('j-city').value.trim()})
      .then(function(){
        try{ localStorage.setItem('door-joined','1'); }catch(e){}
        $('joinFields').innerHTML='<p class="ok" style="font-size:16px">✅ تم تسجيلك! بنتواصل معك أول ما تنطلق النسخة المميزة.</p>';
        setTimeout(function(){ $('join').classList.remove('on'); }, 5000);
      })
      .catch(function(){ btn.disabled=false; btn.textContent='سجّلني'; $('joinErr').textContent='تعذّر الإرسال، تأكد من الإنترنت وجرّب مرة ثانية'; });
  });

  /* ---------- keep data safe: persistent storage + install prompt ---------- */
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

  var standalone = (window.navigator.standalone===true) ||
    (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  var inApp = /FBAN|FBAV|Instagram|WhatsApp|Snapchat|Twitter|Line\//i.test(ua);
  var deferred = null;

  function showInstall(){
    if(standalone) return;
    var snooze=0; try{ snooze=+localStorage.getItem('door-install-later')||0; }catch(e){}
    if(Date.now()<snooze) return;
    var t;
    if(inApp) t='افتح الرابط في '+(isIOS?'<b>Safari</b>':'<b>Chrome</b>')+' (من زر ⋯ اختر "فتح في المتصفح")، وبعدها أضفه للشاشة الرئيسية.';
    else if(isIOS) t='اضغط زر المشاركة ⬆️ تحت، واختر <b>"إضافة إلى الشاشة الرئيسية"</b>. وبعدها افتح التطبيق دايماً من الأيقونة واحفظ عناوينك فيها.';
    else t='اضغط النقاط الثلاث ⋮ فوق، واختر <b>"إضافة إلى الشاشة الرئيسية"</b> أو <b>"تثبيت التطبيق"</b>. وبعدها افتحه دايماً من الأيقونة.';
    $('installTxt').innerHTML=t;
    $('install').classList.add('on');
  }
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); deferred=e; $('installGo').style.display='';
  });
  $('installGo').onclick=function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred=null; $('install').classList.remove('on'); });
  };
  $('installLater').onclick=function(){
    try{ localStorage.setItem('door-install-later', Date.now()+3*24*3600*1000); }catch(e){}
    $('install').classList.remove('on');
  };
  window.addEventListener('appinstalled',function(){ $('install').classList.remove('on'); });

  openDB().then(load).then(function(){ render(); showInstall(); });
  trackOnce('door-t-new','مستخدم جديد');
  if(standalone) trackOnce('door-t-inst','تثبيت على الشاشة');
  trackDaily();
})();
</script>
</body>
</html>
