<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مسابقة الأعلام والعواصم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: لعبة مسابقة مرحة لكن مرتبة، مستوى متوسط
   IDEA: بطاقة أطلس قديمة فوق بحر أزرق — كل سؤال بطاقة جغرافية
   PICTURE: العلم الكبير أو اسم الدولة في قلب البطاقة مع خطوط طول وعرض
   COLOUR and TYPE: أزرق المحيط + رملي الخرائط + مرجاني للتمييز؛ Tajawal
   LAYOUT: عمود واحد هادئ: شريط التقدم، البطاقة، الخيارات، النتيجة */
:root{color-scheme:light dark;
--sea:light-dark(#0e4a63,#0a2533);--sea2:light-dark(#0b3a4e,#061a25);
--sand:light-dark(#f6ecd4,#1d2e38);--sand2:light-dark(#eadbb6,#263b47);
--ink:light-dark(#1d2a30,#eef3f2);--mute:light-dark(#5f6b6b,#9fb3b8);
--coral:#ff6b4a;--ok:#1f9d6b;--bad:#d64541;--line:light-dark(#d8c79e,#34505e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#1b6c8a55,transparent),linear-gradient(var(--sea),var(--sea2));color:var(--ink);font:17px/1.55 Tajawal,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff;margin-bottom:14px}
h1{font-size:clamp(24px,6vw,34px);line-height:1.05;margin:0;font-weight:900;text-wrap:balance}
.best{font-size:14px;opacity:.85;white-space:nowrap}
.card{background:var(--sand);border-radius:22px;box-shadow:0 18px 40px #0005,inset 0 0 0 2px var(--line);padding:22px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
background:repeating-linear-gradient(0deg,transparent 0 47px,var(--line) 47px 48px),repeating-linear-gradient(90deg,transparent 0 47px,var(--line) 47px 48px)}
.card>*{position:relative}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--mute);gap:8px;flex-wrap:wrap}
.hud b{color:var(--ink)}
.bar{height:8px;background:var(--sand2);border-radius:9px;margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral);width:0;transition:width .3s}
.timer{height:5px;background:var(--sand2);border-radius:9px;overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;background:var(--ok);width:100%}
.tag{display:inline-block;font-size:13px;font-weight:700;background:var(--sea);color:#fff;padding:3px 12px;border-radius:99px}
.q{font-size:clamp(20px,5vw,26px);font-weight:700;line-height:1.3;margin:12px 0 8px;text-wrap:balance}
.big{font-size:clamp(90px,28vw,150px);line-height:1.1;text-align:center;margin:4px 0;filter:drop-shadow(0 8px 10px #0003)}
.name{text-align:center;font-size:clamp(30px,8vw,44px);font-weight:900;color:var(--sea);margin:6px 0 10px}
:root[data-theme=dark] .name{color:#7fd0ea}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .name{color:#7fd0ea}}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media(max-width:420px){.opts{grid-template-columns:minmax(0,1fr)}}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:52px}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.opt{background:#fff8;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);padding:10px 14px;font-weight:700;font-size:18px;text-align:center;transition:transform .12s}
:root[data-theme=dark] .opt{background:#ffffff10}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .opt{background:#ffffff10}}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt.ok{background:var(--ok);color:#fff;box-shadow:none}
.opt.bad{background:var(--bad);color:#fff;box-shadow:none}
.opt:disabled{cursor:default}
.fb{min-height:28px;margin-top:12px;font-weight:700;text-align:center}
.main{background:var(--coral);color:#fff;font-weight:900;font-size:19px;width:100%;margin-top:12px}
.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);font-weight:700;width:100%;margin-top:10px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0 4px}
.mode{background:#fff8;box-shadow:inset 0 0 0 2px var(--line);padding:12px;text-align:right;color:var(--ink)}
:root[data-theme=dark] .mode{background:#ffffff10}
.mode[aria-pressed=true]{box-shadow:inset 0 0 0 3px var(--coral)}
.mode b{display:block;font-size:18px}.mode span{font-size:14px;color:var(--mute)}
.globe{font-size:76px;text-align:center;line-height:1}
.score{text-align:center;font-size:clamp(56px,16vw,84px);font-weight:900;color:var(--coral);line-height:1}
.center{text-align:center}
.rev{margin:14px 0 0;padding:0;list-style:none}
.rev li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.rev .e{font-size:30px;flex:none}
.flagbig{display:flex;justify-content:center;align-items:center;min-height:150px;margin:8px 0}
.flagbig img{max-width:min(260px,80%);max-height:170px;border-radius:8px;box-shadow:0 10px 22px #0004,0 0 0 1px #0002}
.flagbig.emo{font-size:clamp(90px,28vw,150px);line-height:1}
.flagsm{flex:none;width:46px;text-align:center}.flagsm img{width:46px;border-radius:4px;box-shadow:0 0 0 1px #0002}.flagsm.emo{font-size:30px}
.rev small{color:var(--mute);display:block}
.hide{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop .35s ease-out}
</style>
</head>
<body>
<div class="wrap">
<header><h1>مسابقة الأعلام والعواصم 🌍</h1><div class="best" id="best"></div></header>

<section class="card" id="start">
  <div class="globe">🗺️</div>
  <p class="q center">جاهز تختبر معلوماتك الجغرافية؟</p>
  <p class="center" id="info" style="color:var(--mute);margin:0">١٢ سؤالاً · ٢٠ ثانية لكل سؤال · مستوى متوسط</p>
  <div class="modes" id="levels">
    <button class="mode" data-l="mid" aria-pressed="true"><b>متوسط 🙂</b><span>دول مشهورة · ٢٠ ثانية</span></button>
    <button class="mode" data-l="hard" aria-pressed="false"><b>صعب 🔥</b><span>دول نادرة وأعلام متشابهة · ١٢ ثانية</span></button>
  </div>
  <div class="modes" id="modes">
    <button class="mode" data-m="mix" aria-pressed="true"><b>منوّعة</b><span>أعلام + عواصم + جغرافيا</span></button>
    <button class="mode" data-m="flag" aria-pressed="false"><b>الأعلام</b><span>اعرف الدولة من علمها</span></button>
    <button class="mode" data-m="cap" aria-pressed="false"><b>العواصم</b><span>دولة ↔ عاصمة</span></button>
    <button class="mode" data-m="geo" aria-pressed="false"><b>جغرافيا عامة</b><span>أنهار، جبال، بحار…</span></button>
  </div>
  <button class="main" id="go">ابدأ المسابقة</button>
</section>

<section class="card hide" id="play">
  <div class="hud"><span>السؤال <b id="qn">1</b> من <b id="qt">12</b></span><span>النقاط <b id="pts">0</b> · السلسلة <b id="stk">0</b>🔥</span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="timer"><i id="tm"></i></div>
  <span class="tag" id="tag"></span>
  <div id="qbox"></div>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <button class="main hide" id="next">التالي ←</button>
</section>

<section class="card hide" id="end">
  <p class="q center" id="verdict"></p>
  <div class="score" id="final"></div>
  <p class="center" id="sub" style="color:var(--mute);margin:6px 0 0"></p>
  <button class="main" id="again">العب مرة ثانية</button>
  <button class="ghost" id="home">غيّر نوع المسابقة</button>
  <ul class="rev" id="rev"></ul>
</section>
</div>

const $=id=>document.getElementById(id);
// صورة العلم (تظهر على ويندوز أيضاً)، وإن تعذّر التحميل يُعرض رمز العلم
function flagEl(c,cls){const w=document.createElement("div");w.className=cls;const im=new Image();im.alt="علم";im.src="https://flagcdn.com/w320/"+c.toLowerCase()+".png";
  im.onerror=()=>{w.textContent=flag(c);w.classList.add("emo")};w.append(im);return w}
const flag=c=>String.fromCodePoint(...[...c].map(ch=>0x1F1E6+ch.charCodeAt(0)-65));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const N=12;let T=20,level="mid";
let mode="mix",qs=[],i=0,pts=0,stk=0,right=0,timer=null,left=T,wrong=[];
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const showBest=()=>{const b=ls.get("geoBest_"+level);$("best").textContent=b?"أفضل نتيجة ("+(level==="hard"?"صعب":"متوسط")+"): "+b:""};
showBest();

let P=C;
function distract(x,key){ // خيارات خاطئة من نفس المنطقة غالباً = مستوى متوسط
  const same=sh(P.filter(o=>o!==x&&o.r===x.r&&o[key]!==x[key]));
  const other=sh(P.filter(o=>o!==x&&o.r!==x.r&&o[key]!==x[key]));
  const out=[];for(const o of [...same.slice(0,2),...other,...same.slice(2)]){if(!out.includes(o[key]))out.push(o[key]);if(out.length===3)break}
  return out;
}
const mk={
  flag:x=>({tag:"علم",q:"لأي دولة هذا العلم؟",fl:x.f,a:x.n,o:distract(x,"n"),f:x.f}),
  cap:x=>({tag:"عاصمة",q:"ما عاصمة هذه الدولة؟",name:x.n,a:x.c,o:distract(x,"c"),f:x.f}),
  capR:x=>({tag:"عاصمة",q:"هذه عاصمة أي دولة؟",name:x.c,a:x.n,o:distract(x,"n"),f:x.f}),
  flagCap:x=>({tag:"علم وعاصمة",q:"ما عاصمة الدولة صاحبة هذا العلم؟",fl:x.f,a:x.c,o:distract(x,"c"),f:x.f}),
  geo:g=>({tag:"جغرافيا",q:g[0],big:g[3],a:g[1],o:g[2],e:g[3]})
};
function build(){
  P=level==="hard"?H:C;T=level==="hard"?12:20;
  const cs=sh(P),gs=sh(level==="hard"?GH:G);let k=0;const take=()=>cs[k++];
  let plan;
  if(mode==="flag")plan=[...Array(9).fill("flag"),...Array(3).fill("flagCap")];
  else if(mode==="cap")plan=[...Array(8).fill("cap"),...Array(4).fill("capR")];
  else if(mode==="geo")plan=Array(N).fill("geo");
  else plan=["flag","flag","flag","flag","cap","cap","cap","capR","flagCap","geo","geo","geo"];
  let g=0;
  return sh(plan).map(t=>{const q=t==="geo"?mk.geo(gs[g++]):mk[t](take());q.opts=sh([q.a,...q.o]);return q});
}
function start(){qs=build();i=0;pts=0;stk=0;right=0;wrong=[];
  $("start").classList.add("hide");$("end").classList.add("hide");$("play").classList.remove("hide");$("qt").textContent=N;render()}
function render(){
  const q=qs[i];clearInterval(timer);left=T;
  $("qn").textContent=i+1;$("pts").textContent=pts;$("stk").textContent=stk;
  $("prog").style.width=(i/N*100)+"%";$("tag").textContent=q.tag;
  const box=$("qbox");box.innerHTML="";
  const p=document.createElement("p");p.className="q";p.textContent=q.q;box.append(p);
  if(q.fl)box.append(flagEl(q.fl,"flagbig pop"));
  if(q.big){const d=document.createElement("div");d.className="big pop";d.textContent=q.big;box.append(d)}
  if(q.name){const d=document.createElement("div");d.className="name pop";d.textContent=q.name;box.append(d)}
  const o=$("opts");o.innerHTML="";
  q.opts.forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(t,b);o.append(b)});
  $("fb").textContent="";$("next").classList.add("hide");
  const tm=$("tm");tm.style.width="100%";tm.style.background="var(--ok)";
  timer=setInterval(()=>{left-=.1;const r=Math.max(left,0)/T;tm.style.width=r*100+"%";
    if(r<.3)tm.style.background="var(--bad)";else if(r<.6)tm.style.background="#e0a526";
    if(left<=0)answer(null,null)},100);
}
function answer(t,btn){
  clearInterval(timer);const q=qs[i];
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add("ok")});
  if(t===q.a){right++;stk++;const bonus=Math.ceil(Math.max(left,0)/2);const gain=10+bonus+(stk>=3?5:0);pts+=gain;
    $("fb").style.color="var(--ok)";$("fb").textContent="إجابة صحيحة! +"+gain+(stk>=3?" (سلسلة 🔥)":"");}
  else{stk=0;if(btn)btn.classList.add("bad");
    $("fb").style.color="var(--bad)";$("fb").textContent=(t===null?"انتهى الوقت ⏰ — ":"خطأ — ")+"الصحيح: "+q.a;
    wrong.push(q);}
  $("pts").textContent=pts;$("stk").textContent=stk;
  const n=$("next");n.textContent=i===N-1?"شوف النتيجة ←":"التالي ←";n.classList.remove("hide");n.focus();
}
function finish(){
  $("play").classList.add("hide");$("end").classList.remove("hide");
  $("final").textContent=right+" / "+N;
  $("sub").textContent="مجموع النقاط: "+pts;
  const v=right>=11?"عبقري جغرافيا! 🏆":right>=8?"ممتاز، معلوماتك قوية 👏":right>=5?"جيد، تقدر تتحسن 💪":"ولا يهمك، جرّب مرة ثانية 🌱";
  $("verdict").textContent=v;
  const b=+ls.get("geoBest_"+level)||0;if(pts>b){ls.set("geoBest_"+level,pts)}showBest();
  const r=$("rev");r.innerHTML="";
  if(wrong.length){const h=document.createElement("li");h.innerHTML="<b>راجع الأسئلة اللي أخطأت فيها:</b>";r.append(h)}
  wrong.forEach(q=>{const li=document.createElement("li");const e=q.f?flagEl(q.f,"flagsm"):document.createElement("span");if(!q.f){e.className="e";e.textContent=q.e}
    const d=document.createElement("div");d.textContent=q.q+(q.name?" ("+q.name+")":"");const s=document.createElement("small");s.textContent="الإجابة: "+q.a;d.append(s);li.append(e,d);r.append(li)});
}
$("next").onclick=()=>{i++;i<N?render():finish()};
$("go").onclick=start;$("again").onclick=start;
$("home").onclick=()=>{$("end").classList.add("hide");$("start").classList.remove("hide")};
const setInfo=()=>{$("info").textContent="١٢ سؤالاً · "+(level==="hard"?"١٢":"٢٠")+" ثانية لكل سؤال · مستوى "+(level==="hard"?"صعب":"متوسط")};
$("levels").addEventListener("click",e=>{const b=e.target.closest(".mode");if(!b)return;level=b.dataset.l;
  [...$("levels").children].forEach(x=>x.setAttribute("aria-pressed",x===b));setInfo();showBest()});
$("modes").addEventListener("click",e=>{const b=e.target.closest(".mode");if(!b)return;mode=b.dataset.m;
  [...$("modes").children].forEach(x=>x.setAttribute("aria-pressed",x===b))});
}
</script>
